<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>eBay Authorization Not Granted - Resale Command Center</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #141a22;
        --text: #eef4fb;
        --muted: #9eacbb;
        --border: #2a3442;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(620px, 100%);
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 7vw, 3rem);
        line-height: 1.08;
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>eBay authorization was not granted.</h1>
      <p>No seller connection was created.</p>
      <p>You can close this page and return to Resale Command Center.</p>
    </main>
  </body>
</html>
